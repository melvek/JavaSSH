tasks:
  deploy:
    steps:
      - name: "停止服务"
        action: command
        with:
          command: "${service_path}deploy.sh -t"
      - name: "上传文件"
        action: push
        with:
          file: "${package_path}"
          dest: "${service_path}"
      - name: "启动服务"
        action: command
        with:
          command: "${service_path}deploy.sh -s"